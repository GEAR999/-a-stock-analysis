name: Deploy Notification

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发

jobs:
  notify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Send Feishu Notification
        if: ${{ github.event_name == 'push' }}
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMIT_AUTHOR="${{ github.actor }}"
          COMMIT_SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          
          # 发送飞书通知
          curl -X POST "${{ secrets.FEISHU_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"interactive\",
              \"card\": {
                \"header\": {
                  \"title\": {\"tag\": \"plain_text\", \"content\": \"🚀 代码已更新 - 请部署\"},
                  \"template\": \"blue\"
                },
                \"elements\": [
                  {
                    \"tag\": \"markdown\",
                    \"content\": \"**仓库**: ${REPO}\n**分支**: main\n**提交**: \`${COMMIT_SHA:0:7}\`\n**作者**: ${COMMIT_AUTHOR}\n**信息**: ${COMMIT_MSG}\n\n---\n\n**请在服务器执行部署**:\n```bash\ncd /var/www/a-stock-analysis && ./deploy.sh\n```\n\n**验证命令**:\n```bash\nsystemctl status a-stock-analysis\ncurl -I http://localhost:5000\n```\"
                  }
                ]
              }
            }" || echo "飞书通知发送失败（可能未配置 FEISHU_WEBHOOK）"

      - name: Print Deployment Info
        run: |
          echo "========================================="
          echo "代码已推送到 main 分支"
          echo "========================================="
          echo "提交: ${{ github.sha }}"
          echo "作者: ${{ github.actor }}"
          echo "信息: ${{ github.event.head_commit.message }}"
          echo ""
          echo "请在服务器执行:"
          echo "  cd /var/www/a-stock-analysis && ./deploy.sh"
          echo "========================================="
